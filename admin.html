<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ממשק ניהול – חבילות נופי פרת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #F4F6F8; --navy: #0F2B3D; --blue: #1A4F6E; --teal: #1B8A9A; --teal-lt: #E2F6F8;
  --green: #2E7D52; --green-lt: #E6F4EE; --red: #C0392B; --red-lt: #FEE8E6;
  --text: #1A2428; --text-lt: #607080; --border: #DDE3E8; --white: #FFFFFF;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
}
body { font-family:'Heebo',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

#loginScreen { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(145deg,#0A1E2C 0%,#0F2B3D 60%,#163A50 100%); padding:20px; }
.login-box { background:var(--white); border-radius:20px; padding:40px 32px; width:100%; max-width:360px; box-shadow:0 20px 60px rgba(0,0,0,0.3); text-align:center; }
.login-icon { font-size:48px; margin-bottom:12px; display:block; }
.login-title { font-size:22px; font-weight:900; color:var(--navy); margin-bottom:6px; }
.login-sub { font-size:14px; color:var(--text-lt); margin-bottom:24px; }
.pw-wrap { position:relative; margin-bottom:14px; }
.login-input { width:100%; padding:13px 44px 13px 16px; border:2px solid var(--border); border-radius:12px; font-family:'Heebo',sans-serif; font-size:18px; text-align:center; letter-spacing:3px; direction:ltr; color:var(--text); transition:border-color 0.2s,box-shadow 0.2s; }
.pw-toggle { position:absolute; left:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:18px; line-height:1; color:var(--text-lt); padding:4px; }
.login-input:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(27,138,154,0.15); }
.login-btn { width:100%; padding:13px; background:var(--navy); color:#fff; border:none; border-radius:12px; font-family:'Heebo',sans-serif; font-size:16px; font-weight:800; cursor:pointer; transition:all 0.2s; }
.login-btn:hover { background:var(--blue); transform:translateY(-1px); }
.login-err { color:var(--red); font-size:13px; font-weight:700; margin-top:10px; display:none; }
.login-err.show { display:block; }

.admin-header { background:linear-gradient(135deg,#0F2B3D 0%,#1A4F6E 100%); color:#fff; padding:18px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.admin-header h1 { font-size:20px; font-weight:900; display:flex; align-items:center; gap:10px; }
.header-right { display:flex; align-items:center; gap:12px; }
.refresh-btn { background:rgba(255,255,255,0.15); color:#fff; border:1px solid rgba(255,255,255,0.25); border-radius:8px; padding:7px 14px; font-family:'Heebo',sans-serif; font-size:13px; font-weight:700; cursor:pointer; transition:background 0.2s; }
.refresh-btn:hover { background:rgba(255,255,255,0.25); }
.logout-btn { background:transparent; color:rgba(255,255,255,0.65); border:none; font-family:'Heebo',sans-serif; font-size:13px; cursor:pointer; padding:7px 10px; border-radius:8px; transition:all 0.2s; }
.logout-btn:hover { background:rgba(255,255,255,0.1); color:#fff; }

.admin-body { max-width:1100px; margin:0 auto; padding:20px 16px 60px; }

.stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
.stat-card { background:var(--white); border-radius:14px; padding:16px 14px; box-shadow:var(--shadow); border:1px solid var(--border); text-align:center; }
.stat-num { font-size:32px; font-weight:900; color:var(--navy); line-height:1; margin-bottom:4px; }
.stat-lbl { font-size:12px; font-weight:600; color:var(--text-lt); line-height:1.4; }
.stat-card.s-paid .stat-num { color:var(--green); }
.stat-card.s-wait .stat-num { color:#BF6000; }
.stat-card.s-done .stat-num { color:var(--blue); }

.filter-bar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
.filter-bar input { flex:1; min-width:160px; padding:9px 14px; border:1.5px solid var(--border); border-radius:10px; font-family:'Heebo',sans-serif; font-size:14px; direction:rtl; }
.filter-bar input:focus { outline:none; border-color:var(--teal); }
.filter-btn { padding:9px 14px; border-radius:10px; font-family:'Heebo',sans-serif; font-size:13px; font-weight:700; cursor:pointer; border:1.5px solid var(--border); background:var(--white); color:var(--text-lt); transition:all 0.2s; white-space:nowrap; }
.filter-btn:hover { border-color:var(--teal); color:var(--teal); }
.filter-btn.active { background:var(--teal); border-color:var(--teal); color:#fff; }

.orders-count { font-size:13px; font-weight:600; color:var(--text-lt); margin-bottom:12px; }

.order-card { background:var(--white); border-radius:14px; padding:18px; margin-bottom:10px; box-shadow:var(--shadow); border:1.5px solid var(--border); transition:box-shadow 0.2s; animation:fadeIn 0.2s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.order-card:hover { box-shadow:0 4px 20px rgba(0,0,0,0.12); }
.order-card.is-delivered { border-color:#B8D8C0; background:#FAFFF8; }
.order-card.is-waiting { border-color:#F0D8A0; }

.oc-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
.oc-name { font-size:17px; font-weight:800; color:var(--navy); display:flex; align-items:center; gap:8px; }
.oc-meta { font-size:12.5px; color:var(--text-lt); margin-top:3px; line-height:1.7; }
.oc-pkg { font-family:monospace; font-size:13px; font-weight:700; background:var(--bg); border-radius:6px; padding:2px 7px; color:var(--navy); }
.oc-right { text-align:left; flex-shrink:0; }
.oc-date { font-size:12px; color:var(--text-lt); margin-bottom:6px; }

.badge { display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:20px; font-size:12px; font-weight:800; }
.b-waiting { background:#FFF3E0; color:#BF6000; }
.b-seen { background:#E3F2FD; color:#1357A6; }
.b-collected { background:#E8F5E9; color:#1B5E20; }
.b-delivered { background:#EDE7F6; color:#4527A0; }

.paid-chip { display:inline-flex; align-items:center; gap:4px; padding:4px 9px; border-radius:20px; font-size:11.5px; font-weight:800; margin-top:5px; cursor:pointer; border:none; font-family:'Heebo',sans-serif; transition:all 0.2s; }
.paid-yes { background:var(--green-lt); color:var(--green); }
.paid-no { background:var(--red-lt); color:var(--red); }
.paid-chip:hover { opacity:0.75; }

.oc-controls { display:flex; align-items:center; gap:10px; flex-wrap:wrap; border-top:1px solid var(--border); padding-top:12px; }
.status-label { font-size:12px; font-weight:700; color:var(--text-lt); white-space:nowrap; }
.status-select { flex:1; min-width:160px; padding:8px 12px; border:1.5px solid var(--border); border-radius:9px; font-family:'Heebo',sans-serif; font-size:14px; font-weight:600; color:var(--text); cursor:pointer; background:var(--bg); direction:rtl; transition:border-color 0.2s; }
.status-select:focus { outline:none; border-color:var(--teal); }
.save-btn { padding:8px 18px; background:var(--teal); color:#fff; border:none; border-radius:9px; font-family:'Heebo',sans-serif; font-size:13px; font-weight:800; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
.save-btn:hover { background:#177A8A; transform:translateY(-1px); }
.save-btn.saved { background:var(--green); pointer-events:none; }

.oc-address { font-size:13px; color:var(--text-lt); background:var(--bg); border-radius:8px; padding:8px 12px; margin:10px 0 4px; }
.msg-toggle { font-size:12px; color:var(--teal); cursor:pointer; background:none; border:none; font-family:'Heebo',sans-serif; font-weight:700; padding:0; }
.msg-toggle:hover { text-decoration:underline; }
.orig-msg { font-size:12px; color:var(--text-lt); background:#F8FAFC; border:1px dashed var(--border); border-radius:8px; padding:10px; margin-top:6px; display:none; direction:rtl; line-height:1.6; }
.orig-msg.open { display:block; }

.empty-state { text-align:center; padding:48px 20px; color:var(--text-lt); }
.empty-state .e-icon { font-size:56px; margin-bottom:14px; }
.empty-state p { font-size:15px; font-weight:600; }
.loading-state { text-align:center; padding:60px 20px; color:var(--text-lt); font-size:15px; }

.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1A3344; color:#fff; padding:12px 24px; border-radius:10px; font-size:14px; font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,0.2); opacity:0; pointer-events:none; transition:opacity 0.3s; z-index:100; white-space:nowrap; }
.toast.show { opacity:1; }

@media (max-width:640px) { .stats-row { grid-template-columns:1fr 1fr; } .oc-top { flex-direction:column; } .oc-right { text-align:right; } }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <span class="login-icon">🔐</span>
    <div class="login-title">ממשק ניהול</div>
    <div class="login-sub">שירות חבילות נופי פרת</div>
    <div class="pw-wrap"><input type="password" class="login-input" id="pwInput" placeholder="••••••••" onkeydown="if(event.key==='Enter') doLogin()"><button class="pw-toggle" type="button" onclick="togglePw()" id="pwEye">👁</button></div>
    <button class="login-btn" onclick="doLogin()">כניסה</button>
    <div class="login-err" id="loginErr">⚠️ סיסמה שגויה</div>
    <div class="login-hint">הסיסמה מוגדרת ב-Code.gs בשורה ADMIN_PASS</div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" style="display:none">
  <div class="admin-header">
    <h1>📦 ניהול חבילות נופי פרת</h1>
    <div class="header-right">
      <button class="refresh-btn" onclick="loadOrders()">🔄 רענון</button>
      <button class="logout-btn" onclick="doLogout()">יציאה ×</button>
    </div>
  </div>
  <div class="admin-body">
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="stTotal">–</div><div class="stat-lbl">סה"כ<br>הזמנות</div></div>
      <div class="stat-card s-paid"><div class="stat-num" id="stPaid">–</div><div class="stat-lbl">שולם<br>✓</div></div>
      <div class="stat-card s-wait"><div class="stat-num" id="stWait">–</div><div class="stat-lbl">ממתינות<br>לאיסוף</div></div>
      <div class="stat-card s-done"><div class="stat-num" id="stDone">–</div><div class="stat-lbl">נמסרו<br>היום</div></div>
    </div>
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="🔍  חיפוש לפי שם / ת״ז / חבילה..." oninput="renderOrders()">
      <button class="filter-btn active" data-f="all"      onclick="setFilter(this)">הכל</button>
      <button class="filter-btn"        data-f="pickup"   onclick="setFilter(this)">איסוף</button>
      <button class="filter-btn"        data-f="delivery" onclick="setFilter(this)">משלוח</button>
      <button class="filter-btn"        data-f="unpaid"   onclick="setFilter(this)">טרם שולם</button>
      <button class="filter-btn"        data-f="waiting"  onclick="setFilter(this)">ממתינות</button>
    </div>
    <div class="orders-count" id="ordersCount"></div>
    <div id="ordersList"><div class="loading-state">⏳ טוען הזמנות...</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════
//  🔧 שנה את הכתובת הזו ל-URL של ה-Apps Script שלך
const GAS_URL = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec';
// ══════════════════════════════════════════════════

function api(params) {
  return fetch(GAS_URL + '?' + new URLSearchParams(params).toString())
    .then(r => r.json());
}

let allOrders = [];
let adminPass = '';
let activeFilter = 'all';

function togglePw() {
  const inp = document.getElementById("pwInput");
  const eye = document.getElementById("pwEye");
  if (inp.type === "password") { inp.type = "text"; eye.textContent = "🙈"; }
  else { inp.type = "password"; eye.textContent = "👁"; }
}

function doLogin() {
  const pw = document.getElementById('pwInput').value;
  const btn = document.querySelector('.login-btn');
  btn.disabled = true; btn.textContent = '...';

  api({action:'getAllOrders', password:pw})
    .then(function(res) {
      btn.disabled = false; btn.textContent = 'כניסה';
      if (res && res.success) {
        adminPass = pw;
        allOrders = res.orders || [];
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminPanel').style.display  = 'block';
        updateStats(); renderOrders();
      } else {
        document.getElementById('loginErr').classList.add('show');
      }
    })
    .catch(function() {
      btn.disabled = false; btn.textContent = 'כניסה';
      document.getElementById('loginErr').classList.add('show');
    });
}

function doLogout() {
  adminPass = ''; allOrders = [];
  document.getElementById('pwInput').value = '';
  document.getElementById('loginErr').classList.remove('show');
  document.getElementById('adminPanel').style.display  = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

function loadOrders() {
  document.getElementById('ordersList').innerHTML = '<div class="loading-state">⏳ טוען...</div>';
  api({action:'getAllOrders', password:adminPass})
    .then(function(res) {
      if (res && res.success) {
        allOrders = res.orders || [];
        updateStats(); renderOrders(); showToast('✅ עודכן!');
      }
    })
    .catch(function() { showToast('⚠️ שגיאה בטעינה'); });
}

function updateStats() {
  const total = allOrders.length;
  const paid  = allOrders.filter(o => o.paid).length;
  const wait  = allOrders.filter(o => o.status === 'ממתין').length;
  const today = new Date().toLocaleDateString('he-IL');
  const done  = allOrders.filter(o => o.status === 'אצלך בבית' && o.timestamp && new Date(o.timestamp).toLocaleDateString('he-IL') === today).length;
  document.getElementById('stTotal').textContent = total;
  document.getElementById('stPaid').textContent  = paid;
  document.getElementById('stWait').textContent  = wait;
  document.getElementById('stDone').textContent  = done;
}

function setFilter(el) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  activeFilter = el.dataset.f;
  renderOrders();
}

function filterOrders() {
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  return allOrders.filter(function(o) {
    const hay = [o.firstName, o.lastName, o.idNumber, o.packageNumber].join(' ').toLowerCase();
    if (q && !hay.includes(q)) return false;
    if (activeFilter === 'pickup'   && !o.serviceType.includes('איסוף'))  return false;
    if (activeFilter === 'delivery' && !o.serviceType.includes('משלוח'))  return false;
    if (activeFilter === 'unpaid'   && o.paid)                             return false;
    if (activeFilter === 'waiting'  && o.status !== 'ממתין')              return false;
    return true;
  });
}

function renderOrders() {
  const list = filterOrders();
  document.getElementById('ordersCount').textContent = 'מציג ' + list.length + ' מתוך ' + allOrders.length + ' הזמנות';
  if (!list.length) {
    document.getElementById('ordersList').innerHTML = '<div class="empty-state"><div class="e-icon">📭</div><p>אין הזמנות להצגה</p></div>';
    return;
  }
  const statusBadge = {
    'ממתין':                 '<span class="badge b-waiting">⏳ ממתין</span>',
    'ראיתי את פרטי החבילה': '<span class="badge b-seen">👀 ראיתי</span>',
    'אספתי את החבילה':      '<span class="badge b-collected">✅ אספתי</span>',
    'אצלך בבית':             '<span class="badge b-delivered">🏠 אצלך בבית</span>'
  };
  const cardClass = {'אצלך בבית':'is-delivered','ממתין':'is-waiting'};

  document.getElementById('ordersList').innerHTML = list.map(function(o) {
    const dt = o.timestamp ? new Date(o.timestamp).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
    const badge = statusBadge[o.status] || '<span class="badge b-waiting">⏳ '+o.status+'</span>';
    const cc    = cardClass[o.status] || '';
    const paidChip = o.paid
      ? '<button class="paid-chip paid-yes" onclick="togglePaid('+o.rowIndex+',false)">✓ שולם</button>'
      : '<button class="paid-chip paid-no"  onclick="togglePaid('+o.rowIndex+',true)">✗ טרם שולם</button>';
    const addrHtml = o.address ? '<div class="oc-address">📍 '+esc(o.address)+'</div>' : '';
    const msgHtml  = o.originalMessage
      ? '<button class="msg-toggle" onclick="toggleMsg(this)">📱 הצג הודעה מקורית</button><div class="orig-msg">'+esc(o.originalMessage)+'</div>'
      : '';
    const opts = ['ממתין','ראיתי את פרטי החבילה','אספתי את החבילה','אצלך בבית']
      .map(s => '<option value="'+s+'"'+(s===o.status?' selected':'')+'>'+s+'</option>').join('');

    return '<div class="order-card '+cc+'" id="oc-'+o.rowIndex+'">'+
      '<div class="oc-top">'+
        '<div>'+
          '<div class="oc-name">'+o.firstName+' '+o.lastName+' <span class="oc-pkg">'+esc(o.packageNumber)+'</span></div>'+
          '<div class="oc-meta">🪪 '+o.idNumber+' &nbsp;|&nbsp; '+(o.serviceType.includes('משלוח')?'🛵 ':'🏠 ')+o.serviceType+' &nbsp;|&nbsp; 💰 '+o.price+' ₪</div>'+
        '</div>'+
        '<div class="oc-right">'+
          '<div class="oc-date">'+dt+'</div>'+badge+'<div>'+paidChip+'</div>'+
        '</div>'+
      '</div>'+
      addrHtml+msgHtml+
      '<div class="oc-controls">'+
        '<span class="status-label">עדכון סטטוס:</span>'+
        '<select class="status-select" id="sel-'+o.rowIndex+'">'+opts+'</select>'+
        '<button class="save-btn" onclick="saveStatus('+o.rowIndex+')">שמור</button>'+
      '</div>'+
    '</div>';
  }).join('');
}

function toggleMsg(btn) {
  const msg = btn.nextElementSibling;
  msg.classList.toggle('open');
  btn.textContent = msg.classList.contains('open') ? '📱 הסתר הודעה' : '📱 הצג הודעה מקורית';
}

function saveStatus(rowIndex) {
  const sel = document.getElementById('sel-'+rowIndex);
  const status = sel.value;
  const btn = sel.nextElementSibling;
  btn.disabled = true; btn.textContent = '...';

  api({action:'updateStatus', rowIndex:rowIndex, status:status, password:adminPass})
    .then(function(res) {
      if (res && res.success) {
        const o = allOrders.find(o => o.rowIndex === rowIndex);
        if (o) o.status = status;
        btn.textContent = '✓ נשמר'; btn.classList.add('saved');
        const card = document.getElementById('oc-'+rowIndex);
        if (card) card.className = 'order-card'+(status==='אצלך בבית'?' is-delivered':status==='ממתין'?' is-waiting':'');
        updateStats();
        setTimeout(function() { btn.textContent='שמור'; btn.classList.remove('saved'); btn.disabled=false; }, 2000);
        showToast('✅ סטטוס עודכן!');
      } else { btn.disabled=false; btn.textContent='שמור'; showToast('⚠️ שגיאה'); }
    })
    .catch(function() { btn.disabled=false; btn.textContent='שמור'; showToast('⚠️ שגיאה'); });
}

function togglePaid(rowIndex, newVal) {
  api({action:'togglePaid', rowIndex:rowIndex, value:String(newVal), password:adminPass})
    .then(function(res) {
      if (res && res.success) {
        const o = allOrders.find(o => o.rowIndex === rowIndex);
        if (o) o.paid = newVal;
        updateStats(); renderOrders();
        showToast(newVal ? '✅ סומן כשולם' : '↩ סומן כלא שולם');
      }
    })
    .catch(function() { showToast('⚠️ שגיאה'); });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2200);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
